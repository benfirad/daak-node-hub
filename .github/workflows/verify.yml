name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify Windows and dashboard sources
        shell: powershell
        run: .\tests\verify.ps1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify updater scripts
        run: >
          zsh -n
          macos/build.command
          macos/install.command
          macos/Resources/update-daak-node.zsh
          macos/Resources/daak-broadcast-control.zsh
          macos/Resources/daak-broadcast-receiver.zsh
      - name: Type-check menu bar app
        run: >
          xcrun --sdk macosx swiftc
          -parse-as-library
          -typecheck
          -target "$(uname -m)-apple-macos13.0"
          macos/Sources/daakLOLILEApp.swift
          -framework SwiftUI
          -framework AppKit
      - name: Build and verify update-enabled app
        run: |
          DAAK_NODE_BUILD_DIR="$RUNNER_TEMP/daak-node-build" \
            DAAK_NODE_SOURCE_COMMIT="$GITHUB_SHA" \
            zsh macos/build.command
          codesign --verify --deep --strict "$RUNNER_TEMP/daak-node-build/daakLOLILE.app"
          test -x "$RUNNER_TEMP/daak-node-build/daakLOLILE.app/Contents/Resources/update-daak-node.zsh"
          test -x "$RUNNER_TEMP/daak-node-build/daakLOLILE.app/Contents/Resources/daak-broadcast-control.zsh"
          test -x "$RUNNER_TEMP/daak-node-build/daakLOLILE.app/Contents/Resources/daak-broadcast-receiver.zsh"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DAAKSourceCommit' "$RUNNER_TEMP/daak-node-build/daakLOLILE.app/Contents/Info.plist")" = "$GITHUB_SHA"
