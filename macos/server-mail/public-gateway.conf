server {
    listen 8088;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only listmonk's documented public routes are reachable from the internet.
    # /admin, /api, /webhooks/bounce and the private dashboard remain Tailnet-only.
    location ~ ^/(subscription|link|campaign|public|uploads)/ {
        proxy_pass http://listmonk:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
